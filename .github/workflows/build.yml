name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Configure Android tools
        shell: pwsh
        run: '"$env:ANDROID_HOME/build-tools/34.0.0" >> $env:GITHUB_PATH'
      - name: Build and test
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew check deploy
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Seam-${{ matrix.os }}
          path: build/libs/Seam.jar
